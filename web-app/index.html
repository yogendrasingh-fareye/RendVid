      try { var a = localStorage.getItem('rendvid.appearance') || 'auto'; document.documentElement.dataset.theme = a === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : a } catch (e) {}
